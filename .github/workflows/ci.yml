# Build + test on every push/PR: Rust engine unit tests, then the full TS suite (unit + the
# conformance harness, which boots its own ephemeral logical-replication Postgres). The harness
# runs against PostgreSQL 18 — the version the engine targets and the one developers run locally —
# installed from PGDG, not the older server the runner image happens to ship.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned to 1.96.0: stable 1.97.0 ICEs compiling dbsp 0.318.0 (rustc
      # next-trait-solver panic in structural_traits.rs). Keep in sync with
      # rust-toolchain.toml; do not float back to @stable until upstream is fixed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          # `cargo fmt --check` below needs the component; the action installs none by default.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting (rustfmt.toml at the root)
        run: cargo fmt --check

      - name: Rust engine tests
        run: cargo test -p electric-circuits-engine

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL 18 and put its binaries on PATH
        run: |
          # No default cluster: the harness runs initdb itself on a free port, and a package-created
          # `18/main` would only burn runner memory.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/initdb --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast: the vitest lane is esbuild (transpile-only) and sees no type errors at all.
      - name: Typecheck
        run: pnpm typecheck

      - name: Full test suite (incl. conformance)
        run: pnpm test
